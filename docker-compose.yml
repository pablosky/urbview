services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urbview
      POSTGRES_USER: urbview
      POSTGRES_PASSWORD: urbview
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: urbview
      POSTGRES_USER: urbview
      POSTGRES_PASSWORD: urbview
    depends_on:
      - db

  # --- ADDED FRONTEND SERVICE ---
  frontend:
    build:
      context: ./frontend # Change to ./urbview-frontend if that's what you named it
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevents host node_modules from breaking container
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
