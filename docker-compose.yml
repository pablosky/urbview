services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urbview
      POSTGRES_USER: urbview
      POSTGRES_PASSWORD: urbview
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: urbview
      POSTGRES_USER: urbview
      POSTGRES_PASSWORD: urbview
    depends_on:
      - db

volumes:
  pgdata:
